# Ce fichier est versionné et ne doit contenir aucun secret.
# Chaque valeur dépendant de l'environnement est lue dans une variable, avec une
# valeur par défaut visant un PostgreSQL local (docker compose up -d db).
# Le compose surcharge ces valeurs par son bloc environment : les variables
# d'environnement sont prioritaires sur ce fichier.

# Spring Configuration
spring.application.name=backend
spring.profiles.active=dev
server.port=8081
server.servlet.context-path=/api

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/withdev}
spring.datasource.username=${DB_USERNAME:withdev}
spring.datasource.password=${DB_PASSWORD:withdev}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Supabase — l'URL JWKS est publique : elle ne sert qu'à vérifier la
# signature des jetons, et n'autorise aucun accès par elle-même.
supabase.jwt.url=${SUPABASE_JWKS_URL:https://gfkuplmkrynlsuudtfmm.supabase.co/auth/v1/.well-known/jwks.json}

# Logs
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
