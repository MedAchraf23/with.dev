# Spring Configuration
spring.application.name=backend
spring.profiles.active=dev

# Database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/meet-talent
spring.datasource.username=meet-talent-api
spring.datasource.password=meet-talent-secret-key

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
security.jwt.secret-key=jwt-generation-secret-key
security.jwt.expiration-time=900000
