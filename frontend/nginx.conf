server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les routes de React Router n'existent pas sur le disque : /offres n'est pas
    # un fichier. Sans ce repli, une ouverture directe de l'URL renverrait 404
    # avant même que React ne démarre. Même rôle que les rewrites de vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers produits par Vite portent une empreinte dans leur nom, ils
    # peuvent donc être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
